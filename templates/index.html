
<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram 下載器</title>
    <!-- 引用外部 CSS -->
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <!-- 標題 -->
        <div class="header">
            <h1>📥 Instagram 下載器</h1>
            <p>貼上 Instagram 影片或照片網址，即可下載</p>
        </div>

        <!-- 搜尋框 -->
        <div class="search-box">
            <div class="input-group">
                <input
                    type="text"
                    id="urlInput"
                    placeholder="貼上 Instagram 網址，例如：https://www.instagram.com/reels/..."
                    autocomplete="off"
                />
                <button class="btn-parse" id="parseBtn" onclick="parseURL()">
                    解析下載
                </button>
            </div>
            <div class="error-msg" id="errorMsg"></div>
        </div>

        <!-- 載入中 -->
        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>正在解析中，請稍候...</p>
        </div>

        <!-- 結果卡片 -->
        <div class="result-card" id="resultCard">
            <div class="post-info" id="postInfo"></div>
            <div class="media-list" id="mediaList"></div>
        </div>

        <!-- 頁尾 -->
        <div class="footer">
            <p>僅供學習研究使用，請尊重原創者的著作權</p>
        </div>
    </div>

    <!-- 引用外部 JS -->
    <script src="/static/script.js"></script>
</body>
</html>
